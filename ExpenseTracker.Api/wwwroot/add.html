<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add expense</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app">

        <header class="topbar">
            <div>
                <a href="index.html" class="back-link">← Back to expenses</a>
                <h1 id="page-title">Add expense</h1>
                <p class="subtitle" id="page-subtitle">Record a new expense</p>
            </div>
            <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme">🌙</button>
        </header>

        <section class="card form-page">
            <form id="expense-form">
                <label>
                    Amount
                    <input type="number" id="amount" placeholder="0.00" step="0.01" min="0.01" required>
                </label>

                <label>
                    Category
                    <select id="category" required>
                        <option value="" disabled selected>Loading...</option>
                    </select>
                    <a href="categories.html" class="field-link">Manage categories</a>
                </label>

                <label>
                    Description
                    <input type="text" id="description" placeholder="Optional note" maxlength="200">
                </label>

                <label>
                    Date
                    <input type="date" id="date" required>
                </label>

                <div class="form-actions">
                    <a href="index.html" class="btn-secondary btn-link">Cancel</a>
                    <button type="submit" class="btn-primary" id="submit-btn">Save expense</button>
                </div>
            </form>
        </section>

    </div>

    <div id="toast" class="toast" role="status"></div>

    <script src="js/common.js"></script>
    <script src="js/add.js"></script>
</body>
</html>
