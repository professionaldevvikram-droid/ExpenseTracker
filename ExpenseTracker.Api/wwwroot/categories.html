<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Categories</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app">

        <header class="topbar">
            <div>
                <a href="index.html" class="back-link">← Back to expenses</a>
                <h1>Categories</h1>
                <p class="subtitle">Organize your spending</p>
            </div>
            <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme">🌙</button>
        </header>

        <div class="stack">
            <section class="card">
                <h2 id="form-title">Add category</h2>
                <form id="category-form">
                    <div class="field-row">
                        <label>
                            Name
                            <input type="text" id="cat-name" placeholder="e.g. Groceries" maxlength="50" required>
                        </label>
                        <label>
                            Color
                            <input type="color" id="cat-color" value="#6366f1">
                        </label>
                    </div>
                    <label>
                        Monthly budget (optional)
                        <input type="number" id="cat-budget" placeholder="No limit" min="0" step="0.01">
                    </label>
                    <div class="form-actions">
                        <button type="button" id="cat-cancel" class="btn-secondary" hidden>Cancel</button>
                        <button type="submit" id="cat-submit" class="btn-primary">Add category</button>
                    </div>
                </form>
            </section>

            <section class="card">
                <h2>Your categories</h2>
                <ul id="category-list" class="expense-list"></ul>
            </section>
        </div>

    </div>

    <div id="toast" class="toast" role="status"></div>

    <script src="js/common.js"></script>
    <script src="js/categories.js"></script>
</body>
</html>
